# J815 (MacBook Air 15-inch, M5) capped speaker profile. Sense layout qualified on hardware (2026-11-11 sweep).
# Provenance and qualification: docs/j815.md.
#
# Thermal/electrical constants: macOS ships one speaker-protection tuning for every 15-inch MacBook Air.
# AID43 (J815, acoustic-id 0x2b) is the same file (hard link) as AID21 (J615) and AID27 (J415); docs/audump.py
# on AID43 reproduces upstream j615.conf exactly. Those values are kept as they are.
# Limits are NOT Apple's: as on J813 (docs/j813.md) the model limit is a conservative 80 C with 5 C headroom
# (Apple: 140 C / 10 C), and the digital ceilings are J813's qualified -24 dB (woofers) / -32 dB (tweeters).
# Channel layout (6 SN012776, ADT speaker-config order = Apple's spp3 Channel0..5): pair k carries speaker k's
# sense, voltage first, as on J813. Left Woofer 1 (0x38) voltage lags its current by one sample, as on J813.
# Both measured on J815 hardware with a low-level sweep per speaker (docs/j815.md, testing/{make,verify}_j815_sweep.py).
[Globals]
visense_pcm = 2
t_ambient = 50.0
t_hysteresis = 5.0
t_window = 20.0
channels = 12
period = 4096
link_gains = True
uclamp_max = 64
max_volume_db = -24.0

[Controls]
vsense = VSENSE Switch
isense = ISENSE Switch
amp_gain = Amp Gain Volume
volume = Speaker Volume

# speaker-config 0: 0x38, V/I sense slots 0/2 (Apple W_L_1)
[Speaker/Left Woofer 1]
group = 1
tr_coil = 40.00
tr_magnet = 26.00
tau_coil = 3.00
tau_magnet = 35.00
t_limit = 80.0
t_headroom = 5.0
z_nominal = 4.20
z_shunt = 0.00
a_t_20c = 0.00352082
a_t_35c = 0.00328147
is_scale = 3.75
vs_scale = 14
vs_chan = 0
is_chan = 1
current_delay_samples = 1
current_delay_rate = 48000

# speaker-config 1: 0x3b, slots 4/6 (Apple W_R_1)
