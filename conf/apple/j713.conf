# J713 (MacBook Air 13-inch, M4) capped speaker profile. Qualification: docs/j713.md.
# Constants and limits from conf/apple/j813.conf (Copyright (C) 2026 Acelogic).
#
# Thermal/electrical constants: the J713 device tree describes the same amplifiers and speaker layout as the
# J813, so the constants and limits are those of the qualified J813 capped profile (docs/j813.md): an 80 C model
# limit with 5 C headroom and -24 dB (woofers) / -32 dB (tweeters) digital ceilings.
# Feedback layout from the J713 device tree: each amp sends current first, then voltage
# (TAS2764 imon/vmon slots 0/2, 4/6, 8/10, 12/14 -> channels 0/1, 2/3, 4/5, 6/7 of the 12-channel
# feedback PCM; 8-11 carry no speaker). Measured on hardware (docs/j713.md): Left Woofer's current lags its
# voltage by one sample at 48 kHz (the J813's left woofer is the mirror case), so its voltage is delayed by one.
[Globals]
visense_pcm = 2
t_ambient = 50.0
t_hysteresis = 5.0
t_window = 20.0
channels = 12
period = 4096
link_gains = True
uclamp_max = 64
max_volume_db = -24.0

[Controls]
vsense = VSENSE Switch
isense = ISENSE Switch
amp_gain = Amp Gain Volume
volume = Speaker Volume

[Speaker/Left Woofer]
group = 1
tr_coil = 32.10
tr_magnet = 20.00
tau_coil = 4.70
tau_magnet = 66.50
t_limit = 80.0
t_headroom = 5.0
z_nominal = 2.8
is_scale = 3.75
vs_scale = 14
is_chan = 0
vs_chan = 1
voltage_delay_samples = 1
voltage_delay_rate = 48000

[Speaker/Right Woofer]
group = 1
tr_coil = 32.10
tr_magnet = 20.00
tau_coil = 4.70
tau_magnet = 66.50
t_limit = 80.0
t_headroom = 5.0
z_nominal = 2.8
is_scale = 3.75
vs_scale = 14
is_chan = 2
vs_chan = 3

[Speaker/Left Tweeter]
max_volume_db = -32.0
group = 0
tr_coil = 140.0
tr_magnet = 200.0
tau_coil = 1.47
tau_magnet = 52.0
t_limit = 80.0
t_headroom = 5.0
z_nominal = 2.7
is_scale = 3.75
vs_scale = 14
is_chan = 4
vs_chan = 5

[Speaker/Right Tweeter]
max_volume_db = -32.0
group = 0
tr_coil = 140.0
tr_magnet = 200.0
tau_coil = 1.47
tau_magnet = 52.0
t_limit = 80.0
t_headroom = 5.0
z_nominal = 2.7
is_scale = 3.75
vs_scale = 14
is_chan = 6
vs_chan = 7
